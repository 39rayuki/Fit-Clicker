<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fit Clicker | 運動で稼げ</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
</head>
<body id="body">
    <h1>Fit Clicker</h1>
    
    <div class="container">
        <!-- Stats Card -->
        <div class="card stats-section">
            <span class="coin-label">累計獲得コイン</span>
            <div class="coin-display" id="coin-count">0</div>
            <div class="bonus-indicator">100倍運動ボーナス発動中</div>
            <div id="stats-list" class="status-text" style="margin-top: 1rem; text-align: left; width: 100%;">
                スクワット: 0 | 腕振り: 0
            </div>
        </div>

        <!-- Camera Card -->
        <div class="card camera-section">
            <div id="video-container" style="position: relative; width: 100%; border-radius: 1rem; overflow: hidden;">
                <video id="video" autoplay playsinline muted style="width: 100%; transform: scaleX(-1);"></video>
                <canvas id="output_canvas" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; transform: scaleX(-1); pointer-events: none;"></canvas>
            </div>
            <div class="motion-meter">
                <div id="motion-bar"></div>
            </div>
            <div class="status-text" id="camera-status">AI（MediaPipe）を起動中...</div>
        </div>

        <!-- Mission Card -->
        <div class="card mission-section" id="mission-card">
            <div class="mission-category">
                <span class="coin-label">🚨 緊急ミッション</span>
                <div id="emergency-mission" class="mission-item empty">現在なし</div>
            </div>
            <hr style="width: 100%; opacity: 0.1; margin: 1rem 0;">
            <div class="mission-category">
                <span class="coin-label">📅 デイリーミッション</span>
                <div id="daily-missions" class="mission-list">
                    <!-- デイリーミッションがここに表示されます -->
                </div>
            </div>
            <hr style="width: 100%; opacity: 0.1; margin: 1rem 0;">
            <div class="mission-category">
                <span class="coin-label">🏆 全体目標</span>
                <div id="global-missions" class="mission-list">
                    <!-- 全体目標がここに表示されます -->
                </div>
            </div>
        </div>

        <!-- Controls -->
        <div class="controls">
            <button id="start-btn">AIトレーニングを開始</button>
        </div>
    </div>

    <!-- Hidden canvas for motion analysis -->
    <canvas id="canvas"></canvas>

    <script src="main.js" type="module"></script>
</body>
</html>
